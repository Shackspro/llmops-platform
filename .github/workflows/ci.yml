
name: LLMOps Platform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-security:
    name: Code Quality, Security and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Check code quality
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run tests
        run: python -m pytest -v


  secret-scan:
    name: Secret Scanning with Gitleaks
    runs-on: ubuntu-latest

    steps:
       - name: Checkout full repository history
         uses: actions/checkout@v6
         with:
           fetch-depth: 0

       - name: Scan repository for secrets
         uses: gitleaks/gitleaks-action@v3
         env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  container-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t llmops-platform:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: llmops-platform:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

